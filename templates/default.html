<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Commitment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">

<div class="text-center max-w-md mx-4">
  <div class="bg-white/10 p-10 rounded-3xl shadow-2xl backdrop-blur-lg border border-white/10">
    <!-- Moon -->
    <div class="text-6xl mb-4">🌙</div>

    <h1 class="text-4xl font-extrabold text-white drop-shadow-lg">
      Lunar Commitment
    </h1>

    <p class="text-lg text-indigo-200 mt-3">
      A first-commit-of-the-year tradition
    </p>

    <div class="my-6 h-px bg-gradient-to-r from-transparent via-indigo-400/30 to-transparent"></div>

    <p class="text-white/60 text-sm leading-relaxed">
      Each Lunar New Year begins with a commit —<br>
      a small ritual wishing for a smooth and prosperous year ahead.
    </p>

    <div class="mt-6 flex justify-center gap-3">
      <div class="w-3 h-3 bg-indigo-400 rounded-full animate-pulse"></div>
      <div class="w-3 h-3 bg-purple-400 rounded-full animate-pulse" style="animation-delay: 0.3s"></div>
      <div class="w-3 h-3 bg-pink-400 rounded-full animate-pulse" style="animation-delay: 0.6s"></div>
    </div>
  </div>

  <p class="mt-6 text-white/30 text-xs">
    lunar-commitment
  </p>
</div>

</body>
</html>
