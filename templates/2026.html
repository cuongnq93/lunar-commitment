<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Commitment 2026 - Year of the Horse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes gallop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(-3deg); }
      50% { transform: translateY(-4px) rotate(0deg); }
      75% { transform: translateY(-16px) rotate(3deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .animate-gallop { animation: gallop 1.2s ease-in-out infinite; }
    .animate-sparkle { animation: sparkle 2s ease-in-out infinite; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-red-700 via-red-600 to-yellow-500">

<div class="text-center max-w-lg mx-4">
  <!-- Lanterns -->
  <div class="flex justify-center gap-6 mb-6">
    <div class="text-5xl animate-sparkle">🏮</div>
    <div class="text-5xl animate-sparkle" style="animation-delay: 0.5s">🏮</div>
    <div class="text-5xl animate-sparkle" style="animation-delay: 1s">🏮</div>
  </div>

  <!-- Main Card -->
  <div class="bg-white/15 p-10 rounded-3xl shadow-2xl backdrop-blur-lg border border-white/20">
    <!-- Horse Icon -->
    <div class="text-7xl mb-4 animate-gallop">🐴</div>

    <h1 class="text-4xl font-extrabold text-white drop-shadow-lg mb-1">
      Happy Lunar New Year!
    </h1>

    <p class="text-xl text-yellow-200 font-semibold">
      Year of the Horse — 2026
    </p>

    <div class="mt-4 text-white/80 text-sm space-y-1">
      <p>Binh Ngo · 丙午</p>
      <p class="text-yellow-100/70 text-xs">The Horse symbolizes energy, freedom, and adventure</p>
    </div>

    <!-- Divider -->
    <div class="my-6 h-px bg-gradient-to-r from-transparent via-yellow-300/50 to-transparent"></div>

    <!-- Wishes -->
    <div class="grid grid-cols-3 gap-3 text-sm">
      <div class="bg-white/10 rounded-xl p-3">
        <div class="text-2xl mb-1">🎊</div>
        <p class="text-yellow-100 font-medium">Prosperity</p>
      </div>
      <div class="bg-white/10 rounded-xl p-3">
        <div class="text-2xl mb-1">💪</div>
        <p class="text-yellow-100 font-medium">Strength</p>
      </div>
      <div class="bg-white/10 rounded-xl p-3">
        <div class="text-2xl mb-1">🌟</div>
        <p class="text-yellow-100 font-medium">Success</p>
      </div>
    </div>

    <!-- First Commit Badge -->
    <div class="mt-6 inline-flex items-center gap-2 bg-yellow-500/20 border border-yellow-400/30 rounded-full px-4 py-2 text-yellow-200 text-sm">
      <span>🚀</span>
      <span>First commit of 2026</span>
    </div>
  </div>

  <!-- Footer -->
  <p class="mt-6 text-white/50 text-xs">
    lunar-commitment · a tradition since 2025
  </p>
</div>

</body>
</html>
